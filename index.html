<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SteamPro MQTT Test</title>
<style>
body{font-family:Arial,sans-serif;background:#111;color:white;text-align:center;padding:30px}
h1{margin-bottom:10px}
#status{padding:12px;border-radius:8px;background:#555;margin:20px auto;max-width:400px}
#temp{font-size:32px;margin:30px}
button{width:180px;height:65px;margin:10px;border:none;border-radius:35px;font-size:22px;font-weight:bold;cursor:pointer}
#start{background:#18a558;color:white} #stop{background:#d62828;color:white}
#log{background:#222;border:1px solid #444;padding:15px;margin-top:25px;text-align:left;height:220px;overflow-y:auto;font-family:monospace}
</style>
</head>
<body>
<h1>SteamPro MQTT Test</h1>
<div id="status">Connecting...</div>
<div id="temp">Sauna: -- °C<br>Water: -- °C</div>
<button id="start" onclick="sendCommand('START')">START</button>
<button id="stop" onclick="sendCommand('STOP')">STOP</button>
<div id="log"></div>
<script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
<script>
const MQTT_URL="ws://broker.emqx.io:8083/mqtt";
const CLIENT_ID="SteamProPC_"+Math.random().toString(16).substring(2,10);
const DEVICE_ID="841FE8470B24";
const TOPIC_TEMP=`steampro/${DEVICE_ID}/temperature`;
const TOPIC_STATUS=`steampro/${DEVICE_ID}/status`;
const TOPIC_COMMAND=`steampro/${DEVICE_ID}/command`;
function log(message){const box=document.getElementById('log');box.innerHTML+='['+new Date().toLocaleTimeString()+'] '+message+'<br>';box.scrollTop=box.scrollHeight;}
function setStatus(text){document.getElementById('status').innerText=text;}
log('Connecting to MQTT...'); log(MQTT_URL);
const client=mqtt.connect(MQTT_URL,{clientId:CLIENT_ID,clean:true,connectTimeout:10000,reconnectPeriod:3000});
client.on('connect',function(){log('MQTT CONNECTED!');setStatus('🟢 MQTT CONNECTED');client.subscribe([TOPIC_TEMP,TOPIC_STATUS],function(err){if(err){log('Subscribe ERROR: '+err.message);}else{log('Temperature + Status subscribe OK');}});});
client.on('message',function(topic,message){const msg=message.toString();log('RX: '+topic);log('DATA: '+msg);if(topic===TOPIC_TEMP){try{const data=JSON.parse(msg);const sauna=data.sauna!==undefined?data.sauna:'--';const water=data.water!==undefined?data.water:'--';document.getElementById('temp').innerHTML='Sauna: '+sauna+' °C<br>Water: '+water+' °C';}catch(e){log('JSON ERROR (temperature)');}}if(topic===TOPIC_STATUS){try{const data=JSON.parse(msg);log('STATUS RECEIVED');}catch(e){log('JSON ERROR (status)');}}});
client.on('error',function(error){console.log(error);log('MQTT ERROR: '+error.message);setStatus('🔴 MQTT ERROR');});
client.on('close',function(){log('MQTT connection closed');setStatus('🟠 MQTT DISCONNECTED');});
client.on('reconnect',function(){log('Trying to reconnect...');setStatus('🟡 RECONNECTING...');});
function sendCommand(command){if(!client.connected){log('NOT CONNECTED!');return;}client.publish(TOPIC_COMMAND,command,function(err){if(err)log('COMMAND FAILED: '+err.message);else log('COMMAND SENT: '+command);});}
</script>
</body>
</html>
