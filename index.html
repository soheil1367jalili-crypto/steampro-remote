<!DOCTYPE html>

<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SteamPro Remote</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    background:#0d1117;
    color:#ffffff;
    font-family:Arial,sans-serif;
}

.container{
    width:100%;
    max-width:520px;
    margin:auto;
    padding:18px;
}

/* HEADER */

.header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:18px;
}

.title{
    font-size:28px;
    font-weight:bold;
}

.subtitle{
    font-size:12px;
    color:#8b949e;
    margin-top:4px;
}

.connection{
    padding:8px 12px;
    border-radius:20px;
    background:#555;
    font-size:12px;
}

.connection.ok{
    background:#16803c;
}

.connection.error{
    background:#9b1c2c;
}

.connection.wait{
    background:#806000;
}

/* CARD */

.card{
    background:#161b22;
    border:1px solid #252c35;
    border-radius:20px;
    padding:18px;
    margin-bottom:14px;
}

/* TEMPERATURE */

.temperatures{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
}

.temperature{
    text-align:center;
}

.temperature-label{
    color:#9da7b3;
    font-size:14px;
}

.temperature-value{
    font-size:44px;
    font-weight:bold;
    margin-top:7px;
}

.unit{
    font-size:18px;
    color:#9da7b3;
}

/* TIMER */

.timer{
    text-align:center;
}

.timer-title{
    color:#9da7b3;
    font-size:14px;
}

.timer-value{
    font-size:42px;
    font-weight:bold;
    margin:8px 0;
}

.state{
    display:flex;
    justify-content:center;
    gap:8px;
    flex-wrap:wrap;
}

.badge{
    background:#202731;
    border-radius:16px;
    padding:7px 11px;
    font-size:12px;
}

/* BUTTONS */

.buttons{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
}
